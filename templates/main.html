<html>
<head>
<title>Cover Letter Generator</title>


<style>
    header {
        text-align: center;
    }

    .input_section {
        background-color: #f0f0f0;
        padding: 15px;
        margin-top: 100px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 10px;
        border: 2px solid #ccc;
    }

    .gen_section {
        text-align: center;
    }

    .genButton {
        background-color: green;
        border: none;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
    }

    .upload {
        display: inline-block;
        padding: 10px 18px;
        background-color: black;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        margin: 10px;
        font-size: 15px;
    }

</style>
</head>

<body>
<header>
    <h1>Generate a Cover Letter</h1>
</header>

<form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
    <div class="input_section">
        <h1>
            Add a resume and job description
        </h1>
        <label class="upload">
            Resume
            <input type="file" name="resume" id="resume" accept=".pdf,.doc,.docx,.txt" style="display:none;">
        </label>
        <p id="resumeName" style="font-size: 20px; font-style: italic; text-align: center"></p>

        <label class="upload">
            Job Description
            <input type="file" name="job" id="job" accept=".pdf,.doc,.docx,.txt" style="display:none;">
        </label>

        <p id="jobName" style="font-size: 20px; font-style: italic; text-align: center"></p>

        <p id="error" style="color:red; font-size: 20px; display:none;">
            Please upload both a resume and a job description!
        </p>
    </div>

    <div class="gen_section">
        <button type="submit" class="genButton">Generate</button>
    </div>
</form>

<script>
const form = document.getElementById("uploadForm");
const resumeInput = document.getElementById("resume");
const jobInput = document.getElementById("job");

const resumeName = document.getElementById("resumeName");
const jobName = document.getElementById("jobName");
const error = document.getElementById("error");

const output = document.createElement("p");
document.body.appendChild(output);

resumeInput.addEventListener("change", () => {
    resumeName.textContent = resumeInput.files[0]?.name || "";
});

jobInput.addEventListener("change", () => {
    jobName.textContent = jobInput.files[0]?.name || "";
});

form.addEventListener("submit", async (e) => {
    e.preventDefault(); // 🚫 no page reload

    error.style.display = "none";
    output.textContent = "";

    if (!resumeInput.files.length || !jobInput.files.length) {
        error.style.display = "block";
        return;
    }

    const formData = new FormData(form);

    output.textContent = "Uploading...";

    try {
        const res = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (data.success) {
            output.textContent = "✅ " + data.message;
        } else {
            output.textContent = "❌ " + data.error;
        }
    } catch (err) {
        output.textContent = "❌ Server error";
    }
});

</script>

</body>
</html>
